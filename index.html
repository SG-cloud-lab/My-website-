<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discipleship Nation Family Church</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo-container">
            <img src="assets/images/logo.png" alt="Church Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/40'">
            <div class="brand-text">
                <h1>Discipleship Nation</h1>
                <p>Family Church</p>
            </div>
        </div>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
            <i class="fas fa-bars"></i>
        </button>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <a href="#live" class="btn-live-top">Join Live Service</a>
        
        <div class="hero-content">
            <h2>Welcome to Your Family in Christ</h2>
            <p class="hero-subtext">Prophetic Word, Discipleship & Daily Devotionals with Prophet Shemmy</p>
            <p class="hero-author">Prophetic Word, Discipleship & Daily Devotionals with <strong>Prophet Shemmy Gaviyawo</strong></p>
            
            <div class="hero-buttons">
                <a href="#watch" class="btn-hero">Watch Live</a>
                <a href="#devotional" class="btn-hero">Today's Devotional</a>
                <a href="#messages" class="btn-hero">Latest Message</a>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
